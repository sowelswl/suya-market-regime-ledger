name: Attest public ledger evidence

on:
  push:
    branches: [main]
    paths:
      - "commitments/**/*.json"
      - "reveals/**/*.json"
      - "corrections/**/*.jsonl"
      - "evaluation/v1.json"
      - "evaluation/v1.1.json"
      - "evaluation/v1.2.json"
      - "evaluation/public/history.json"
      - "publication/v1.json"
      - "EVALUATION_V1.md"
      - "EVALUATION_V1_1.md"
      - "EVALUATION_V1_2.md"
      - "PUBLICATION_POLICY_V1.md"
      - "CORRECTIONS.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/attest@v4
        with:
          subject-path: |
            commitments/**/*.json
            reveals/**/*.json
            corrections/**/*.jsonl
            evaluation/v1.json
            evaluation/v1.1.json
            evaluation/v1.2.json
            evaluation/public/history.json
            publication/v1.json
            EVALUATION_V1.md
            EVALUATION_V1_1.md
            EVALUATION_V1_2.md
            PUBLICATION_POLICY_V1.md
            CORRECTIONS.md
